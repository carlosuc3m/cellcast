name: Build Python Wheels

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stardist-burn-training
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - stardist-burn-training

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.name }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/cellcast_python/Cargo.toml
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"

      - name: Smoke test native wheel
        if: matrix.name == 'linux-x86_64' || matrix.name == 'windows-x86_64' || matrix.name == 'macos-x86_64'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import cellcast.models.stardist_2d
          import cellcast.training.stardist_2d
          print("cellcast Python inference and training modules import correctly")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cellcast-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  collect-wheels:
    name: Collect wheels
    runs-on: ubuntu-latest
    needs: build-wheels
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cellcast-wheel-*
          path: wheels
          merge-multiple: true

      - name: List wheels
        run: |
          ls -lh wheels

      - name: Upload combined wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: cellcast-wheelhouse
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 30
